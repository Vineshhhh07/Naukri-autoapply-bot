name: Naukri Auto-Apply Bot

on:
  workflow_dispatch:  # Allows you to click the "Run workflow" button manually
  schedule:
    - cron: '30 4 * * *'  # Automatically runs once a day at 10:00 AM IST (4:30 AM UTC)

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the Bot
        env:
          NAUKRI_EMAIL: ${{ secrets.NAUKRI_EMAIL }}
          NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
          FIRSTNAME: "Vinesh"
          LASTNAME: "Tiwari"
          # Expanded keywords to catch more automation/QA roles!
          KEYWORDS: "QA Engineer, Software Tester, Test Engineer, Automation Tester, QA Analyst, Selenium Tester, API Tester, SDET"
          # Expanded location to capture the whole NCR region!
          LOCATION: "Delhi, NCR, Noida, Gurugram"
          MAX_APPLICATIONS: "50"
          PAGES_PER_KEYWORD: "1"
        run: |
          xvfb-run python Naukri-Edge.py

      # --- THE NEW SCREENSHOT SAVER ---
      - name: Upload Debug Screenshots
        if: always()  # Triggers even if the run fails/crashes
        uses: actions/upload-artifact@v4
        with:
          name: naukri-debug-screenshots
          path: '*.png'
          retention-days: 5
